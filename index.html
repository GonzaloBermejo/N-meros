<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ara li toca a...</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 40px;
      background-color: #f5f5f5;
    }

    h1 {
      font-size: 36px;
    }

    h2 {
      font-size: 28px;
      margin-top: 30px;
    }

    #nombre {
      font-size: 50px;
      font-weight: bold;
      margin: 25px 20px;
    }

    #numero {
      font-size: 80px;
      font-weight: bold;
      margin: 20px;
    }

    button {
      font-size: 26px;
      padding: 15px 35px;
      cursor: pointer;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .contenedor-listas {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    .cuadro {
      background-color: white;
      border: 2px solid #333;
      border-radius: 10px;
      width: 320px;
      min-height: 250px;
      padding: 15px;
      box-sizing: border-box;
    }

    .cuadro h3 {
      font-size: 24px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .lista-nombres {
      font-size: 18px;
      line-height: 1.6;
    }

  </style>
</head>

<body>

  <h1>Ara li toca a...</h1>

  <div id="nombre">---</div>

  <h2>Has de col·locar el número...</h2>

  <div id="numero">---</div>

  <button onclick="generar()">Generar</button>

  <div class="contenedor-listas">

    <div class="cuadro">
      <h3>Ja han sortit</h3>
      <div id="hanSortit" class="lista-nombres">—</div>
    </div>

    <div class="cuadro">
      <h3>Queden per sortir</h3>
      <div id="queden" class="lista-nombres"></div>
    </div>

  </div>

  <script>

    const nombres = [
      "Jan",
      "Jaden",
      "Laura",
      "Hugo",
      "Faustino",
      "Tamara",
      "María",
      "Silke",
      "Lila",
      "Naila",
      "Jad",
      "Ilina",
      "Martí",
      "Laia",
      "Aleksandr",
      "Andrew Matías",
      "Dominika",
      "Albert",
      "Varvara",
      "Luz",
      "Aliha",
      "Andrew Jeremías",
      "Ellen",
      "Redhen",
      "Amy",
      "Taoming",
      "Hengji"
    ];

    let nombresDisponibles = [...nombres];
    let nombresSalidos = [];

    function actualizarListas() {

      const hanSortit = document.getElementById("hanSortit");
      const queden = document.getElementById("queden");

      if (nombresSalidos.length === 0) {
        hanSortit.innerHTML = "—";
      } else {
        hanSortit.innerHTML = nombresSalidos.join("<br>");
      }

      if (nombresDisponibles.length === 0) {
        queden.innerHTML = "—";
      } else {
        queden.innerHTML = nombresDisponibles.join("<br>");
      }
    }

    function generar() {

      // Si ja han sortit tots, comença una nova ronda
      if (nombresDisponibles.length === 0) {
        nombresDisponibles = [...nombres];
        nombresSalidos = [];
      }

      // Escollir un alumne a l'atzar
      const indice = Math.floor(Math.random() * nombresDisponibles.length);

      // Treure l'alumne de la llista dels que queden
      const nombreAleatorio = nombresDisponibles.splice(indice, 1)[0];

      // Afegir-lo a la llista dels que ja han sortit
      nombresSalidos.push(nombreAleatorio);

      // Generar un número aleatori entre -5 i +5
      const numero = Math.random() * 10 - 5;

      // Mostrar sempre el signe + en els positius
      const numeroAleatorio =
        numero >= 0
          ? "+" + numero.toFixed(2)
          : numero.toFixed(2);

      // Mostrar el nom i el número
      document.getElementById("nombre").textContent = nombreAleatorio;
      document.getElementById("numero").textContent = numeroAleatorio;

      // Actualitzar els dos quadres
      actualizarListas();
    }

    // Mostrar tots els alumnes inicialment a la dreta
    actualizarListas();

  </script>

</body>
</html>
