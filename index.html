<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ara li toca...</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background-color: #f7f7f5;
      min-height: 100vh;
    }

    .pagina {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 30px;
      width: 100%;
      min-height: 100vh;
      padding: 30px;
      align-items: center;
    }

    /* QUADRES LATERALS */

    .cuadro {
      background-color: white;
      border: 1px solid #cfcfcf;
      border-radius: 14px;
      padding: 18px;
      height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .cuadro h3 {
      text-align: center;
      font-size: 22px;
      margin-top: 4px;
      margin-bottom: 18px;
    }

    .lista-nombres {
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
    }

    /* PART CENTRAL */

    .centro {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    h1 {
      font-size: 50px;
      margin: 0 0 25px 0;
    }

    #nombre {
      font-size: 72px;
      font-weight: 700;
      min-height: 90px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 38px;
      margin: 0 0 25px 0;
    }

    #numero {
      font-size: 100px;
      font-weight: 700;
      min-height: 115px;
      margin-bottom: 20px;
    }

    #bombo {
      display: none;
      width: 180px;
      max-height: 180px;
      object-fit: contain;
      margin: 10px 0 30px 0;
    }

    button {
      font-size: 30px;
      padding: 17px 48px;
      cursor: pointer;
      border-radius: 12px;
      border: none;
      background-color: #222;
      color: white;
    }

    button:hover {
      background-color: #444;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    @media (max-width: 900px) {

      .pagina {
        grid-template-columns: 1fr;
      }

      .cuadro {
        height: auto;
      }

      .centro {
        order: -1;
      }

    }

  </style>
</head>

<body>

  <div class="pagina">

    <!-- ESQUERRA -->

    <div class="cuadro">
      <h3>Ja han sortit</h3>
      <div id="hanSortit" class="lista-nombres">—</div>
    </div>


    <!-- CENTRE -->

    <div class="centro">

      <h1 id="frase">Ara li toca a...</h1>

      <div id="nombre">---</div>

      <h2>Has de col·locar el número...</h2>

      <div id="numero">---</div>

      <img id="bombo" src="bingo.gif" alt="Bombo de bingo">

      <button id="boton" onclick="generar()">Generar</button>

    </div>


    <!-- DRETA -->

    <div class="cuadro">
      <h3>Queden per sortir</h3>
      <div id="queden" class="lista-nombres"></div>
    </div>

  </div>


  <script>

    const alumnes = [
      { nom: "Jan", frase: "Ara li toca al" },
      { nom: "Jaden", frase: "Ara li toca al" },
      { nom: "Laura", frase: "Ara li toca a la" },
      { nom: "Hugo", frase: "Ara li toca a l'" },
      { nom: "Faustino", frase: "Ara li toca al" },
      { nom: "Tamara", frase: "Ara li toca a la" },
      { nom: "María", frase: "Ara li toca a la" },
      { nom: "Silke", frase: "Ara li toca a la" },
      { nom: "Lila", frase: "Ara li toca a la" },
      { nom: "Naila", frase: "Ara li toca a la" },
      { nom: "Jad", frase: "Ara li toca al" },
      { nom: "Ilina", frase: "Ara li toca a l'" },
      { nom: "Martí", frase: "Ara li toca al" },
      { nom: "Laia", frase: "Ara li toca a la" },
      { nom: "Aleksandr", frase: "Ara li toca a l'" },
      { nom: "Andrew Matías", frase: "Ara li toca a l'" },
      { nom: "Dominika", frase: "Ara li toca a la" },
      { nom: "Albert", frase: "Ara li toca a l'" },
      { nom: "Varvara", frase: "Ara li toca a la" },
      { nom: "Luz", frase: "Ara li toca a la" },
      { nom: "Aliha", frase: "Ara li toca a l'" },
      { nom: "Andrew Jeremías", frase: "Ara li toca a l'" },
      { nom: "Ellen", frase: "Ara li toca a l'" },
      { nom: "Redhen", frase: "Ara li toca al" },
      { nom: "Amy", frase: "Ara li toca a l'" },
      { nom: "Taoming", frase: "Ara li toca al" },
      { nom: "Hengji", frase: "Ara li toca al" }
    ];


    function crearNumeros() {

      const numeros = [];

      for (let i = -500; i <= 500; i++) {
        numeros.push(i / 100);
      }

      return numeros;
    }


    let alumnesDisponibles = [...alumnes];
    let alumnesSortits = [];
    let numerosDisponibles = crearNumeros();


    function actualizarListas() {

      const hanSortit = document.getElementById("hanSortit");
      const queden = document.getElementById("queden");

      if (alumnesSortits.length === 0) {
        hanSortit.innerHTML = "—";
      } else {
        hanSortit.innerHTML =
          alumnesSortits.map(alumne => alumne.nom).join("<br>");
      }

      if (alumnesDisponibles.length === 0) {
        queden.innerHTML = "—";
      } else {
        queden.innerHTML =
          alumnesDisponibles.map(alumne => alumne.nom).join("<br>");
      }

    }


    function generar() {

      const boton = document.getElementById("boton");
      const bombo = document.getElementById("bombo");
      const nombre = document.getElementById("nombre");
      const numero = document.getElementById("numero");
      const frase = document.getElementById("frase");

      boton.disabled = true;

      // Amagar el resultat anterior
      frase.textContent = "Ara li toca a...";
      nombre.textContent = "???";
      numero.textContent = "???";

      // Mostrar el bombo
      bombo.style.display = "block";


      setTimeout(function() {

        if (alumnesDisponibles.length === 0) {

          alumnesDisponibles = [...alumnes];
          alumnesSortits = [];
          numerosDisponibles = crearNumeros();

        }


        // Escollir alumne

        const indiceAlumne =
          Math.floor(Math.random() * alumnesDisponibles.length);

        const alumne =
          alumnesDisponibles.splice(indiceAlumne, 1)[0];

        alumnesSortits.push(alumne);


        // Escollir número no repetit

        const indiceNumero =
          Math.floor(Math.random() * numerosDisponibles.length);

        const numeroEscollit =
          numerosDisponibles.splice(indiceNumero, 1)[0];


        const numeroAleatori =
          numeroEscollit >= 0
            ? "+" + numeroEscollit.toFixed(2)
            : numeroEscollit.toFixed(2);


        // Amagar el bombo
        bombo.style.display = "none";


        // Mostrar resultat

        frase.textContent = alumne.frase;
        nombre.textContent = alumne.nom;
        numero.textContent = numeroAleatori;


        actualizarListas();

        boton.disabled = false;

      }, 1500);

    }


    actualizarListas();

  </script>

</body>
</html>
