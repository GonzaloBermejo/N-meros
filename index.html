<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sorteig aleatori</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-color: #fafaf8;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #111;
    }

    .pagina {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      gap: 45px;
      height: 100vh;
      padding: 45px 15px;
      align-items: center;
    }

    /* PANELS LATERALS */

    .cuadro {
      height: 90vh;
      background: white;
      border: 1px solid #d6d6d6;
      border-radius: 15px;
      padding: 28px 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
      overflow-y: auto;
    }

    .cuadro h3 {
      margin: 0 0 25px 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
    }

    .lista-nombres {
      font-size: 20px;
      line-height: 1.6;
      text-align: center;
    }

    /* ZONA CENTRAL */

    .centro {
      height: 90vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    /* FASE SORTEIG NOM */

    #faseNom {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #textoNom {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    #imatgeNom {
      width: 330px;
      max-height: 300px;
      object-fit: contain;
      margin-bottom: 30px;
    }

    /* BARRA DE PROGRÉS */

    .barra-contenidor {
      width: 420px;
      max-width: 80%;
      height: 18px;
      background-color: #e4e4e4;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    #barraProgres {
      width: 0%;
      height: 100%;
      background-color: #222;
      border-radius: 20px;
    }

    /* ALUMNE */

    #faseAlumne {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #frase {
      font-size: 50px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    #nombre {
      font-size: 76px;
      font-weight: 750;
      min-height: 95px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;
    }

    /* FASE BOMBO */

    #faseBombo {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #textoBombo {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    #bombo {
      width: 390px;
      height: 330px;
      object-fit: contain;
      display: block;
    }

    /* NÚMERO */

    #faseNumero {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #textoNumero {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #numero {
      font-size: 110px;
      font-weight: 750;
      min-height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ESTAT INICIAL */

    #faseInicial {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #faseInicial h1 {
      font-size: 52px;
      margin-bottom: 25px;
    }

    #faseInicial p {
      font-size: 28px;
      margin: 0;
    }

    /* BOTÓ */

    button {
      margin-top: 25px;
      font-size: 34px;
      padding: 18px 65px;
      background-color: #222;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }

    button:hover {
      background-color: #3b3b3b;
      transform: translateY(-1px);
    }

    button:disabled {
      background-color: #929292;
      cursor: default;
      transform: none;
    }

    /* PANTALLES MÉS PETITES */

    @media (max-width: 1100px) {

      .pagina {
        grid-template-columns: 230px 1fr 230px;
        gap: 25px;
      }

      .cuadro h3 {
        font-size: 23px;
      }

      .lista-nombres {
        font-size: 18px;
      }

      #frase {
        font-size: 42px;
      }

      #nombre {
        font-size: 64px;
      }

      #textoNom,
      #textoBombo,
      #textoNumero {
        font-size: 34px;
      }

      #imatgeNom {
        width: 280px;
      }

      #bombo {
        width: 330px;
        height: 280px;
      }

      #numero {
        font-size: 95px;
      }

    }

  </style>
</head>

<body>

  <div class="pagina">

    <!-- ESQUERRA -->

    <div class="cuadro">

      <h3>Ja han sortit</h3>

      <div
        id="hanSortit"
        class="lista-nombres">
        —
      </div>

    </div>


    <!-- CENTRE -->

    <div class="centro">


      <!-- ESTAT INICIAL -->

      <div id="faseInicial">

        <h1>Sorteig aleatori</h1>

        <p>
          Prem el botó per començar
        </p>

      </div>


      <!-- FASE 1: NOM -->

      <div id="faseNom">

        <div id="textoNom">
          Escollint alumne...
        </div>

        <img
          id="imatgeNom"
          src="namesinhat.jpg"
          alt="Noms dins d'un barret"
        >

        <div class="barra-contenidor">
          <div id="barraProgres"></div>
        </div>

      </div>


      <!-- FASE 2: ALUMNE -->

      <div id="faseAlumne">

        <div id="frase">
          Ara li toca a...
        </div>

        <div id="nombre">
          —
        </div>

      </div>


      <!-- FASE 3: BOMBO -->

      <div id="faseBombo">

        <div id="textoBombo">
          Preparant el número...
        </div>

        <img
          id="bombo"
          src="bingo.gif"
          alt="Bombo de bingo"
        >

      </div>


      <!-- FASE 4: NÚMERO -->

      <div id="faseNumero">

        <div id="textoNumero">
          Has de col·locar el número...
        </div>

        <div id="numero">
          —
        </div>

      </div>


      <!-- BOTÓ -->

      <button
        id="boton"
        onclick="generar()">
        Generar
      </button>


    </div>


    <!-- DRETA -->

    <div class="cuadro">

      <h3>Queden per sortir</h3>

      <div
        id="queden"
        class="lista-nombres">
      </div>

    </div>

  </div>


  <script>

    const alumnes = [

      { nom: "Jan", frase: "Ara li toca al" },
      { nom: "Jaden", frase: "Ara li toca al" },
      { nom: "Laura", frase: "Ara li toca a la" },
      { nom: "Hugo", frase: "Ara li toca a l'" },
      { nom: "Faustino", frase: "Ara li toca al" },
      { nom: "Tamara", frase: "Ara li toca a la" },
      { nom: "María", frase: "Ara li toca a la" },
      { nom: "Silke", frase: "Ara li toca a la" },
      { nom: "Lila", frase: "Ara li toca a la" },
      { nom: "Naila", frase: "Ara li toca a la" },
      { nom: "Jad", frase: "Ara li toca al" },
      { nom: "Ilina", frase: "Ara li toca a l'" },
      { nom: "Martí", frase: "Ara li toca al" },
      { nom: "Laia", frase: "Ara li toca a la" },
      { nom: "Aleksandr", frase: "Ara li toca a l'" },
      { nom: "Andrew Matías", frase: "Ara li toca a l'" },
      { nom: "Dominika", frase: "Ara li toca a la" },
      { nom: "Albert", frase: "Ara li toca a l'" },
      { nom: "Varvara", frase: "Ara li toca a la" },
      { nom: "Luz", frase: "Ara li toca a la" },
      { nom: "Aliha", frase: "Ara li toca a l'" },
      { nom: "Andrew Jeremías", frase: "Ara li toca a l'" },
      { nom: "Ellen", frase: "Ara li toca a l'" },
      { nom: "Redhen", frase: "Ara li toca al" },
      { nom: "Amy", frase: "Ara li toca a l'" },
      { nom: "Taoming", frase: "Ara li toca al" },
      { nom: "Hengji", frase: "Ara li toca al" }

    ];


    function crearNumeros() {

      const numeros = [];

      for (let i = -500; i <= 500; i++) {
        numeros.push(i / 100);
      }

      return numeros;

    }


    let alumnesDisponibles = [...alumnes];
    let alumnesSortits = [];
    let numerosDisponibles = crearNumeros();


    function actualizarListas() {

      const hanSortit =
        document.getElementById("hanSortit");

      const queden =
        document.getElementById("queden");


      if (alumnesSortits.length === 0) {

        hanSortit.innerHTML = "—";

      } else {

        hanSortit.innerHTML =
          alumnesSortits
            .map(alumne => alumne.nom)
            .join("<br>");

      }


      if (alumnesDisponibles.length === 0) {

        queden.innerHTML = "—";

      } else {

        queden.innerHTML =
          alumnesDisponibles
            .map(alumne => alumne.nom)
            .join("<br>");

      }

    }


    function ocultarFases() {

      document.getElementById("faseInicial").style.display = "none";
      document.getElementById("faseNom").style.display = "none";
      document.getElementById("faseAlumne").style.display = "none";
      document.getElementById("faseBombo").style.display = "none";
      document.getElementById("faseNumero").style.display = "none";

    }


    function generar() {

      const boton =
        document.getElementById("boton");

      const barra =
        document.getElementById("barraProgres");


      boton.disabled = true;


      /* NOVA RONDA */

      if (alumnesDisponibles.length === 0) {

        alumnesDisponibles = [...alumnes];
        alumnesSortits = [];
        numerosDisponibles = crearNumeros();

      }


      /* ESCOLLIR ALUMNE */

      const indiceAlumne =
        Math.floor(
          Math.random() *
          alumnesDisponibles.length
        );


      const alumne =
        alumnesDisponibles[indiceAlumne];


      /* FASE 1: SORTEIG DEL NOM */

      ocultarFases();

      document.getElementById("faseNom").style.display = "flex";


      barra.style.transition = "none";
      barra.style.width = "0%";


      setTimeout(function() {

        barra.style.transition = "width 2.5s linear";
        barra.style.width = "100%";

      }, 50);


      /* DESPRÉS DE 2,5 SEGONS: MOSTRAR NOM */

      setTimeout(function() {


        alumnesDisponibles.splice(indiceAlumne, 1);

        alumnesSortits.push(alumne);


        ocultarFases();

        document.getElementById("faseAlumne").style.display = "flex";


        document.getElementById("frase").textContent =
          alumne.frase;

        document.getElementById("nombre").textContent =
          alumne.nom;


        actualizarListas();


        /* DEIXAR VEURE EL NOM 1,5 SEGONS */

        setTimeout(function() {


          /* FASE 3: BOMBO */

          ocultarFases();

          document.getElementById("faseAlumne").style.display = "flex";
          document.getElementById("faseBombo").style.display = "flex";


          /* ESPERAR 3 SEGONS */

          setTimeout(function() {


            /* ESCOLLIR NÚMERO */

            const indiceNumero =
              Math.floor(
                Math.random() *
                numerosDisponibles.length
              );


            const numeroEscollit =
              numerosDisponibles.splice(
                indiceNumero,
                1
              )[0];


            const numeroAleatori =
              numeroEscollit >= 0
                ? "+" + numeroEscollit.toFixed(2)
                : numeroEscollit.toFixed(2);


            /* MOSTRAR RESULTAT FINAL */

            ocultarFases();

            document.getElementById("faseAlumne").style.display = "flex";
            document.getElementById("faseNumero").style.display = "flex";


            document.getElementById("numero").textContent =
              numeroAleatori;


            boton.disabled = false;


          }, 3000);


        }, 1500);


      }, 2600);

    }


    actualizarListas();

  </script>

</body>
</html>
