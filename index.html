<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ara li toca a...</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
      background-color: #f5f5f5;
    }

    h1 {
      font-size: 36px;
    }

    h2 {
      font-size: 28px;
      margin-top: 40px;
    }

    #nombre {
      font-size: 50px;
      font-weight: bold;
      margin: 30px 20px;
    }

    #numero {
      font-size: 80px;
      font-weight: bold;
      margin: 20px;
    }

    #quedan {
      font-size: 20px;
      margin: 30px;
    }

    button {
      font-size: 26px;
      padding: 15px 35px;
      cursor: pointer;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>Ara li toca a...</h1>

  <div id="nombre">---</div>

  <h2>Has de col·locar el número...</h2>

  <div id="numero">---</div>

  <div id="quedan">Queden 27 alumnes</div>

  <button onclick="generar()">Generar</button>

  <script>

    const nombres = [
      "Jan",
      "Jaden",
      "Laura",
      "Hugo",
      "Faustino",
      "Tamara",
      "María",
      "Silke",
      "Lila",
      "Naila",
      "Jad",
      "Ilina",
      "Martí",
      "Laia",
      "Aleksandr",
      "Andrew Matías",
      "Dominika",
      "Albert",
      "Varvara",
      "Luz",
      "Aliha",
      "Andrew Jeremías",
      "Ellen",
      "Redhen",
      "Amy",
      "Taoming",
      "Hengji"
    ];

    let nombresDisponibles = [...nombres];

    function generar() {

      // Si ja han sortit tots, comença una nova ronda
      if (nombresDisponibles.length === 0) {
        nombresDisponibles = [...nombres];
      }

      // Escollir un alumne a l'atzar
      const indice = Math.floor(Math.random() * nombresDisponibles.length);

      // Eliminar-lo de la llista perquè no torni a sortir
      const nombreAleatorio = nombresDisponibles.splice(indice, 1)[0];

      // Generar un número aleatori entre -5 i +5
      const numero = Math.random() * 10 - 5;

      // Mostrar sempre el signe + en els positius
      const numeroAleatorio =
        numero >= 0
          ? "+" + numero.toFixed(2)
          : numero.toFixed(2);

      // Mostrar el nom i el número
      document.getElementById("nombre").textContent = nombreAleatorio;
      document.getElementById("numero").textContent = numeroAleatorio;

      // Mostrar quants alumnes queden
      if (nombresDisponibles.length === 0) {
        document.getElementById("quedan").textContent =
          "Ja han sortit tots! La propera vegada comença una nova ronda.";
      } else if (nombresDisponibles.length === 1) {
        document.getElementById("quedan").textContent =
          "Queda 1 alumne";
      } else {
        document.getElementById("quedan").textContent =
          "Queden " + nombresDisponibles.length + " alumnes";
      }
    }

  </script>

</body>
</html>
