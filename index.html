<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ara li toca al...</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
      min-height: 100vh;
    }

    /* Estructura principal: esquerra - centre - dreta */

    .pagina {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 30px;
      width: 100%;
      min-height: 100vh;
      padding: 30px;
      align-items: center;
    }

    /* Quadres laterals */

    .cuadro {
      background-color: white;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 15px;
      height: 90vh;
      overflow-y: auto;
    }

    .cuadro h3 {
      text-align: center;
      font-size: 21px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .lista-nombres {
      font-size: 18px;
      line-height: 1.45;
      text-align: center;
    }

    /* Part central */

    .centro {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 44px;
      margin: 0 0 35px 0;
    }

    #nombre {
      font-size: 60px;
      font-weight: bold;
      min-height: 75px;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 32px;
      margin: 0 0 35px 0;
    }

    #numero {
      font-size: 85px;
      font-weight: bold;
      min-height: 100px;
      margin-bottom: 35px;
    }

    button {
      font-size: 28px;
      padding: 16px 45px;
      cursor: pointer;
      border-radius: 12px;
      border: 2px solid #777;
      background-color: white;
    }

    button:hover {
      background-color: #e8e8e8;
    }

    /* Adaptació per a pantalles petites */

    @media (max-width: 900px) {

      .pagina {
        grid-template-columns: 1fr;
      }

      .cuadro {
        height: auto;
      }

      .centro {
        order: -1;
      }

    }

  </style>
</head>

<body>

  <div class="pagina">

    <!-- ESQUERRA -->

    <div class="cuadro">
      <h3>Ja han sortit</h3>
      <div id="hanSortit" class="lista-nombres">—</div>
    </div>


    <!-- CENTRE -->

    <div class="centro">

      <h1>Ara li toca a...</h1>

      <div id="nombre">---</div>

      <h2>Has de col·locar el número...</h2>

      <div id="numero">---</div>

      <button onclick="generar()">Generar</button>

    </div>


    <!-- DRETA -->

    <div class="cuadro">
      <h3>Queden per sortir</h3>
      <div id="queden" class="lista-nombres"></div>
    </div>

  </div>


  <script>

    const nombres = [
      "Jan",
      "Jaden",
      "Laura",
      "Hugo",
      "Faustino",
      "Tamara",
      "María",
      "Silke",
      "Lila",
      "Naila",
      "Jad",
      "Ilina",
      "Martí",
      "Laia",
      "Aleksandr",
      "Andrew Matías",
      "Dominika",
      "Albert",
      "Varvara",
      "Luz",
      "Aliha",
      "Andrew Jeremías",
      "Ellen",
      "Redhen",
      "Amy",
      "Taoming",
      "Hengji"
    ];

    let nombresDisponibles = [...nombres];
    let nombresSalidos = [];


    function actualizarListas() {

      const hanSortit = document.getElementById("hanSortit");
      const queden = document.getElementById("queden");

      if (nombresSalidos.length === 0) {
        hanSortit.innerHTML = "—";
      } else {
        hanSortit.innerHTML = nombresSalidos.join("<br>");
      }

      if (nombresDisponibles.length === 0) {
        queden.innerHTML = "—";
      } else {
        queden.innerHTML = nombresDisponibles.join("<br>");
      }

    }


    function generar() {

      // Si ja han sortit tots, començar una nova ronda

      if (nombresDisponibles.length === 0) {
        nombresDisponibles = [...nombres];
        nombresSalidos = [];
      }


      // Escollir un alumne a l'atzar

      const indice =
        Math.floor(Math.random() * nombresDisponibles.length);

      const nombreAleatorio =
        nombresDisponibles.splice(indice, 1)[0];


      // Afegir-lo als alumnes que ja han sortit

      nombresSalidos.push(nombreAleatorio);


      // Generar número entre -5 i +5

      const numero = Math.random() * 10 - 5;

      const numeroAleatorio =
        numero >= 0
          ? "+" + numero.toFixed(2)
          : numero.toFixed(2);


      // Mostrar resultat

      document.getElementById("nombre").textContent =
        nombreAleatorio;

      document.getElementById("numero").textContent =
        numeroAleatorio;


      // Actualitzar els quadres laterals

      actualizarListas();

    }


    // Mostrar inicialment tots els alumnes a la dreta

    actualizarListas();

  </script>

</body>
</html>
