<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ara li toca...</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
      min-height: 100vh;
    }

    .pagina {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 30px;
      width: 100%;
      min-height: 100vh;
      padding: 30px;
      align-items: center;
    }

    .cuadro {
      background-color: white;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 15px;
      height: 90vh;
      overflow-y: auto;
    }

    .cuadro h3 {
      text-align: center;
      font-size: 21px;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .lista-nombres {
      font-size: 18px;
      line-height: 1.45;
      text-align: center;
    }

    .centro {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 44px;
      margin: 0 0 35px 0;
    }

    #nombre {
      font-size: 60px;
      font-weight: bold;
      min-height: 75px;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 32px;
      margin: 0 0 35px 0;
    }

    #numero {
      font-size: 85px;
      font-weight: bold;
      min-height: 100px;
      margin-bottom: 35px;
    }

    button {
      font-size: 28px;
      padding: 16px 45px;
      cursor: pointer;
      border-radius: 12px;
      border: 2px solid #777;
      background-color: white;
    }

    button:hover {
      background-color: #e8e8e8;
    }

    @media (max-width: 900px) {

      .pagina {
        grid-template-columns: 1fr;
      }

      .cuadro {
        height: auto;
      }

      .centro {
        order: -1;
      }

    }

  </style>
</head>

<body>

  <div class="pagina">

    <!-- ESQUERRA -->

    <div class="cuadro">
      <h3>Ja han sortit</h3>
      <div id="hanSortit" class="lista-nombres">—</div>
    </div>


    <!-- CENTRE -->

    <div class="centro">

      <h1 id="frase">Ara li toca a...</h1>

      <div id="nombre">---</div>

      <h2>Has de col·locar el número...</h2>

      <div id="numero">---</div>

      <button onclick="generar()">Generar</button>

    </div>


    <!-- DRETA -->

    <div class="cuadro">
      <h3>Queden per sortir</h3>
      <div id="queden" class="lista-nombres"></div>
    </div>

  </div>


  <script>

    const alumnes = [
      { nom: "Jan", frase: "Ara li toca al" },
      { nom: "Jaden", frase: "Ara li toca al" },
      { nom: "Laura", frase: "Ara li toca a la" },
      { nom: "Hugo", frase: "Ara li toca a l'" },
      { nom: "Faustino", frase: "Ara li toca al" },
      { nom: "Tamara", frase: "Ara li toca a la" },
      { nom: "María", frase: "Ara li toca a la" },
      { nom: "Silke", frase: "Ara li toca a la" },
      { nom: "Lila", frase: "Ara li toca a la" },
      { nom: "Naila", frase: "Ara li toca a la" },
      { nom: "Jad", frase: "Ara li toca al" },
      { nom: "Ilina", frase: "Ara li toca a l'" },
      { nom: "Martí", frase: "Ara li toca al" },
      { nom: "Laia", frase: "Ara li toca a la" },
      { nom: "Aleksandr", frase: "Ara li toca a l'" },
      { nom: "Andrew Matías", frase: "Ara li toca a l'" },
      { nom: "Dominika", frase: "Ara li toca a la" },
      { nom: "Albert", frase: "Ara li toca a l'" },
      { nom: "Varvara", frase: "Ara li toca a la" },
      { nom: "Luz", frase: "Ara li toca a la" },
      { nom: "Aliha", frase: "Ara li toca a l'" },
      { nom: "Andrew Jeremías", frase: "Ara li toca a l'" },
      { nom: "Ellen", frase: "Ara li toca a l'" },
      { nom: "Redhen", frase: "Ara li toca al" },
      { nom: "Amy", frase: "Ara li toca a l'" },
      { nom: "Taoming", frase: "Ara li toca al" },
      { nom: "Hengji", frase: "Ara li toca al" }
    ];


    function crearNumeros() {

      const numeros = [];

      for (let i = -500; i <= 500; i++) {
        numeros.push(i / 100);
      }

      return numeros;
    }


    let alumnesDisponibles = [...alumnes];
    let alumnesSortits = [];
    let numerosDisponibles = crearNumeros();


    function actualizarListas() {

      const hanSortit = document.getElementById("hanSortit");
      const queden = document.getElementById("queden");

      if (alumnesSortits.length === 0) {
        hanSortit.innerHTML = "—";
      } else {
        hanSortit.innerHTML =
          alumnesSortits.map(alumne => alumne.nom).join("<br>");
      }

      if (alumnesDisponibles.length === 0) {
        queden.innerHTML = "—";
      } else {
        queden.innerHTML =
          alumnesDisponibles.map(alumne => alumne.nom).join("<br>");
      }

    }


    function generar() {

      // Si ja han sortit tots, començar una nova ronda

      if (alumnesDisponibles.length === 0) {

        alumnesDisponibles = [...alumnes];
        alumnesSortits = [];
        numerosDisponibles = crearNumeros();

      }


      // Escollir alumne a l'atzar

      const indiceAlumne =
        Math.floor(Math.random() * alumnesDisponibles.length);

      const alumne =
        alumnesDisponibles.splice(indiceAlumne, 1)[0];

      alumnesSortits.push(alumne);


      // Escollir un número que encara no hagi sortit

      const indiceNumero =
        Math.floor(Math.random() * numerosDisponibles.length);

      const numero =
        numerosDisponibles.splice(indiceNumero, 1)[0];


      // Formatar número

      const numeroAleatori =
        numero >= 0
          ? "+" + numero.toFixed(2)
          : numero.toFixed(2);


      // Mostrar alumne

      document.getElementById("frase").textContent =
        alumne.frase;

      document.getElementById("nombre").textContent =
        alumne.nom;


      // Mostrar número

      document.getElementById("numero").textContent =
        numeroAleatori;


      // Actualitzar les llistes

      actualizarListas();

    }


    actualizarListas();

  </script>

</body>
</html>
