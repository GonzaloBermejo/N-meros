<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Selector aleatori</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
      background-color: #f5f5f5;
    }

    h1 {
      font-size: 36px;
    }

    #nombre {
      font-size: 50px;
      font-weight: bold;
      margin: 40px 20px 20px;
    }

    #numero {
      font-size: 80px;
      font-weight: bold;
      margin: 20px;
    }

    #quedan {
      font-size: 20px;
      margin: 20px;
    }

    button {
      font-size: 26px;
      padding: 15px 35px;
      cursor: pointer;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>Selector aleatori</h1>

  <div id="nombre">---</div>

  <div id="numero">---</div>

  <div id="quedan">Queden 27 alumnes</div>

  <button onclick="generar()">Generar</button>

  <script>

    const nombres = [
      "Jan Abajo Hou",
      "Jaden Steven Andrade Sánchez",
      "Laura Arbat Ruíz",
      "Hugo Barroso Martínez",
      "Faustino Caporale",
      "Tamara Cherif García",
      "María Forts Marías",
      "Silke García Martínez",
      "Lila García García",
      "Naila Gracia Werckmeister",
      "Jad Gridda",
      "Ilina Hu",
      "Martí Iglesias Rico",
      "Laia Mora Moreno",
      "Aleksandr Muzykantsky",
      "Andrew Matías Navas González",
      "Dominika Osman",
      "Albert Quintana Vega",
      "Varvara Rabetskaya",
      "Luz Rodríguez Jaen",
      "Aliha Saleem",
      "Andrew Jeremías Sánchez Riveros",
      "Ellen Zooey Sánchez Ramos",
      "Redhen Dwayne Sandoval Asilo",
      "Amy Sueiro",
      "Taoming Ye",
      "Hengji Zhang"
    ];

    let nombresDisponibles = [...nombres];

    function generar() {

      // Si ja han sortit tots, comença una nova ronda
      if (nombresDisponibles.length === 0) {
        nombresDisponibles = [...nombres];
      }

      // Escollir un alumne a l'atzar
      const indice = Math.floor(Math.random() * nombresDisponibles.length);

      // Eliminar-lo de la llista perquè no torni a sortir
      const nombreAleatorio = nombresDisponibles.splice(indice, 1)[0];

      // Generar un número aleatori entre -5 i +5
      const numero = Math.random() * 10 - 5;

      // Mostrar sempre el signe + en els positius
      const numeroAleatorio =
        numero >= 0
          ? "+" + numero.toFixed(2)
          : numero.toFixed(2);

      document.getElementById("nombre").textContent = nombreAleatorio;
      document.getElementById("numero").textContent = numeroAleatorio;

      // Mostrar quants en queden
      if (nombresDisponibles.length === 0) {
        document.getElementById("quedan").textContent =
          "Ja han sortit tots! La propera vegada comença una nova ronda.";
      } else if (nombresDisponibles.length === 1) {
        document.getElementById("quedan").textContent =
          "Queda 1 alumne";
      } else {
        document.getElementById("quedan").textContent =
          "Queden " + nombresDisponibles.length + " alumnes";
      }
    }

  </script>

</body>
</html>
