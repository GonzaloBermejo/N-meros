<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ara li toca...</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-color: #fafaf8;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #111;
    }

    .pagina {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      gap: 45px;
      height: 100vh;
      padding: 60px 15px;
      align-items: center;
    }

    /* PANELS LATERALS */

    .cuadro {
      height: 90vh;
      background: white;
      border: 1px solid #d6d6d6;
      border-radius: 15px;
      padding: 28px 22px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.04);

      overflow-y: auto;
    }

    .cuadro h3 {
      margin: 0 0 25px 0;
      text-align: center;

      font-size: 28px;
      font-weight: 700;
    }

    .lista-nombres {
      font-size: 20px;
      line-height: 1.6;
      text-align: center;
    }

    /* ZONA CENTRAL */

    .centro {
      height: 90vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    /* RESULTAT */

    #zonaResultat {
      width: 100%;
    }

    #frase {
      font-size: 52px;
      font-weight: 700;
      margin: 0 0 25px 0;
    }

    #nombre {
      font-size: 76px;
      font-weight: 750;
      min-height: 95px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 35px;
    }

    h2 {
      font-size: 42px;
      font-weight: 700;

      margin: 0 0 20px 0;
    }

    #numero {
      font-size: 110px;
      font-weight: 750;
      min-height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 25px;
    }

    /* BOMBO */

    #zonaBombo {
      display: none;

      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #textoBombo {
      font-size: 46px;
      font-weight: 700;
      margin-bottom: 55px;
    }

    #bombo {
      width: 440px;
      height: 440px;
      object-fit: contain;
      display: block;
    }

    /* BOTÓN */

    button {
      margin-top: 30px;

      font-size: 34px;
      padding: 18px 65px;

      background-color: #222;
      color: white;

      border: none;
      border-radius: 14px;

      cursor: pointer;

      transition:
        background-color 0.2s,
        transform 0.15s;
    }

    button:hover {
      background-color: #3b3b3b;
      transform: translateY(-1px);
    }

    button:disabled {
      background-color: #929292;
      cursor: default;
      transform: none;
    }

    /* PANTALLES MÉS PETITES */

    @media (max-width: 1100px) {

      .pagina {
        grid-template-columns: 230px 1fr 230px;
        gap: 25px;
      }

      .cuadro h3 {
        font-size: 23px;
      }

      .lista-nombres {
        font-size: 18px;
      }

      #frase {
        font-size: 44px;
      }

      #nombre {
        font-size: 65px;
      }

      h2 {
        font-size: 35px;
      }

      #numero {
        font-size: 95px;
      }

      #bombo {
        width: 370px;
        height: 370px;
      }

    }

  </style>
</head>


<body>

  <div class="pagina">


    <!-- ESQUERRA -->

    <div class="cuadro">

      <h3>Ja han sortit</h3>

      <div
        id="hanSortit"
        class="lista-nombres">
        —
      </div>

    </div>


    <!-- CENTRE -->

    <div class="centro">


      <!-- RESULTAT -->

      <div id="zonaResultat">

        <div id="frase">
          Ara li toca a...
        </div>

        <div id="nombre">
          —
        </div>

        <h2>
          Has de col·locar el número...
        </h2>

        <div id="numero">
          —
        </div>

      </div>


      <!-- BOMBO -->

      <div id="zonaBombo">

        <div id="textoBombo">
          Has de col·locar el número...
        </div>

        <img
          id="bombo"
          src="bingo.gif"
          alt="Bombo de bingo"
        >

      </div>


      <!-- BOTÓN -->

      <button
        id="boton"
        onclick="generar()">
        Generar
      </button>


    </div>


    <!-- DRETA -->

    <div class="cuadro">

      <h3>Queden per sortir</h3>

      <div
        id="queden"
        class="lista-nombres">
      </div>

    </div>


  </div>


  <script>

    const alumnes = [

      { nom: "Jan", frase: "Ara li toca al" },
      { nom: "Jaden", frase: "Ara li toca al" },
      { nom: "Laura", frase: "Ara li toca a la" },
      { nom: "Hugo", frase: "Ara li toca a l'" },
      { nom: "Faustino", frase: "Ara li toca al" },
      { nom: "Tamara", frase: "Ara li toca a la" },
      { nom: "María", frase: "Ara li toca a la" },
      { nom: "Silke", frase: "Ara li toca a la" },
      { nom: "Lila", frase: "Ara li toca a la" },
      { nom: "Naila", frase: "Ara li toca a la" },
      { nom: "Jad", frase: "Ara li toca al" },
      { nom: "Ilina", frase: "Ara li toca a l'" },
      { nom: "Martí", frase: "Ara li toca al" },
      { nom: "Laia", frase: "Ara li toca a la" },
      { nom: "Aleksandr", frase: "Ara li toca a l'" },
      { nom: "Andrew Matías", frase: "Ara li toca a l'" },
      { nom: "Dominika", frase: "Ara li toca a la" },
      { nom: "Albert", frase: "Ara li toca a l'" },
      { nom: "Varvara", frase: "Ara li toca a la" },
      { nom: "Luz", frase: "Ara li toca a la" },
      { nom: "Aliha", frase: "Ara li toca a l'" },
      { nom: "Andrew Jeremías", frase: "Ara li toca a l'" },
      { nom: "Ellen", frase: "Ara li toca a l'" },
      { nom: "Redhen", frase: "Ara li toca al" },
      { nom: "Amy", frase: "Ara li toca a l'" },
      { nom: "Taoming", frase: "Ara li toca al" },
      { nom: "Hengji", frase: "Ara li toca al" }

    ];


    function crearNumeros() {

      const numeros = [];

      for (let i = -500; i <= 500; i++) {
        numeros.push(i / 100);
      }

      return numeros;

    }


    let alumnesDisponibles = [...alumnes];

    let alumnesSortits = [];

    let numerosDisponibles = crearNumeros();


    function actualizarListas() {

      const hanSortit =
        document.getElementById("hanSortit");

      const queden =
        document.getElementById("queden");


      if (alumnesSortits.length === 0) {

        hanSortit.innerHTML = "—";

      } else {

        hanSortit.innerHTML =
          alumnesSortits
            .map(alumne => alumne.nom)
            .join("<br>");

      }


      if (alumnesDisponibles.length === 0) {

        queden.innerHTML = "—";

      } else {

        queden.innerHTML =
          alumnesDisponibles
            .map(alumne => alumne.nom)
            .join("<br>");

      }

    }


    function generar() {

      const boton =
        document.getElementById("boton");

      const zonaResultat =
        document.getElementById("zonaResultat");

      const zonaBombo =
        document.getElementById("zonaBombo");


      /* Desactivar botó */

      boton.disabled = true;


      /* Ocultar resultat anterior */

      zonaResultat.style.display = "none";


      /* Mostrar bombo */

      zonaBombo.style.display = "flex";


      /* Esperar 3 segons */

      setTimeout(function() {


        /* Reiniciar quan han sortit tots */

        if (alumnesDisponibles.length === 0) {

          alumnesDisponibles = [...alumnes];

          alumnesSortits = [];

          numerosDisponibles = crearNumeros();

        }


        /* Escollir alumne */

        const indiceAlumne =
          Math.floor(
            Math.random() *
            alumnesDisponibles.length
          );


        const alumne =
          alumnesDisponibles.splice(
            indiceAlumne,
            1
          )[0];


        alumnesSortits.push(alumne);


        /* Escollir número no repetit */

        const indiceNumero =
          Math.floor(
            Math.random() *
            numerosDisponibles.length
          );


        const numeroEscollit =
          numerosDisponibles.splice(
            indiceNumero,
            1
          )[0];


        /* Formatar número */

        const numeroAleatori =
          numeroEscollit >= 0
            ? "+" + numeroEscollit.toFixed(2)
            : numeroEscollit.toFixed(2);


        /* Mostrar resultat */

        document.getElementById("frase").textContent =
          alumne.frase;

        document.getElementById("nombre").textContent =
          alumne.nom;

        document.getElementById("numero").textContent =
          numeroAleatori;


        /* Amagar bombo */

        zonaBombo.style.display = "none";


        /* Mostrar resultat */

        zonaResultat.style.display = "block";


        actualizarListas();


        /* Reactivar botó */

        boton.disabled = false;


      }, 3000);

    }


    actualizarListas();

  </script>

</body>
</html>
