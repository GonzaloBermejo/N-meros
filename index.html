<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sorteig aleatori</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-color: #fafaf8;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #111;
    }

    .pagina {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      gap: 45px;
      height: 100vh;
      padding: 45px 15px;
      align-items: center;
    }

    /* PANELS LATERALS */

    .cuadro {
      height: 90vh;
      background: white;
      border: 1px solid #d6d6d6;
      border-radius: 15px;
      padding: 28px 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
      overflow-y: auto;
    }

    .cuadro h3 {
      margin: 0 0 25px 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
    }

    .lista-nombres {
      font-size: 20px;
      line-height: 1.6;
      text-align: center;
    }

    /* ZONA CENTRAL */

    .centro {
      height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* FASES */

    .fase {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #faseInicial {
      display: flex;
    }

    /* TÍTOLS */

    .titulo-fase {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    /* IMATGES */

    #imatgeNom {
      width: 440px;
      max-height: 410px;
      object-fit: contain;
      margin-bottom: 35px;
    }

    #bombo {
      width: 440px;
      max-height: 410px;
      object-fit: contain;
      margin-bottom: 35px;
    }

    /* BARRA DE PROGRÉS */

    .barra-contenidor {
      width: 550px;
      max-width: 85%;
      height: 22px;
      background-color: #e4e4e4;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .barra-progres {
      width: 0%;
      height: 100%;
      background-color: #222;
      border-radius: 20px;
    }

    /* RESULTAT FINAL */

    #resultatNom {
      font-size: 58px;
      font-weight: 700;
      margin-bottom: 35px;
    }

    #resultatNumeroText {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #numero {
      font-size: 110px;
      font-weight: 750;
    }

    /* ESTAT INICIAL */

    #faseInicial h1 {
      font-size: 52px;
      margin-bottom: 25px;
    }

    #faseInicial p {
      font-size: 28px;
      margin: 0;
    }

    /* BOTÓ PRINCIPAL */

    #boton {
      margin-top: 30px;
      font-size: 34px;
      padding: 18px 65px;
      background-color: #222;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
    }

    #boton:hover {
      background-color: #3b3b3b;
      transform: translateY(-1px);
    }

    #boton:disabled {
      background-color: #999;
      cursor: default;
      transform: none;
    }

    /* BOTÓ CONFIGURACIÓ */

    #botonConfig {
      position: absolute;
      top: 0;
      right: 0;

      background: white;
      color: #333;

      border: 1px solid #ccc;
      border-radius: 10px;

      font-size: 18px;
      padding: 9px 14px;

      cursor: pointer;
    }

    #botonConfig:hover {
      background-color: #f0f0f0;
    }

    /* PANELL CONFIGURACIÓ */

    #configPanel {
      display: none;

      position: absolute;
      top: 55px;
      right: 0;

      width: 290px;

      background: white;

      border: 1px solid #ccc;
      border-radius: 14px;

      padding: 20px;

      box-shadow: 0 6px 18px rgba(0,0,0,0.12);

      text-align: left;

      z-index: 20;
    }

    #configPanel h3 {
      margin-top: 0;
      margin-bottom: 18px;
      text-align: center;
      font-size: 21px;
    }

    .config-fila {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 14px;
    }

    .config-fila label {
      font-size: 17px;
    }

    .config-fila input {
      width: 100px;
      font-size: 17px;
      padding: 6px 8px;

      border: 1px solid #bbb;
      border-radius: 7px;
    }

    #guardarConfig {
      display: block;
      width: 100%;

      margin-top: 15px;
      padding: 10px;

      font-size: 17px;

      background: #222;
      color: white;

      border: none;
      border-radius: 8px;

      cursor: pointer;
    }

    #guardarConfig:hover {
      background: #444;
    }

    #mensajeConfig {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      color: #555;
      min-height: 18px;
    }

    /* PANTALLES MÉS PETITES */

    @media (max-width: 1100px) {

      .pagina {
        grid-template-columns: 230px 1fr 230px;
        gap: 25px;
      }

      .cuadro h3 {
        font-size: 23px;
      }

      .lista-nombres {
        font-size: 18px;
      }

      .titulo-fase {
        font-size: 40px;
      }

      #imatgeNom,
      #bombo {
        width: 360px;
        max-height: 330px;
      }

      #resultatNom {
        font-size: 50px;
      }

      #resultatNumeroText {
        font-size: 34px;
      }

      #numero {
        font-size: 95px;
      }

    }

  </style>
</head>

<body>

  <div class="pagina">

    <!-- ESQUERRA -->

    <div class="cuadro">

      <h3>Ja han sortit</h3>

      <div id="hanSortit" class="lista-nombres">
        —
      </div>

    </div>


    <!-- CENTRE -->

    <div class="centro">

      <!-- CONFIGURACIÓ -->

      <button id="botonConfig" onclick="toggleConfig()">
        ⚙ Configuració
      </button>

      <div id="configPanel">

        <h3>Configuració del número</h3>

        <div class="config-fila">
          <label for="minim">Mínim</label>
          <input id="minim" type="number" value="-5">
        </div>

        <div class="config-fila">
          <label for="maxim">Màxim</label>
          <input id="maxim" type="number" value="5">
        </div>

        <div class="config-fila">
          <label for="decimals">Decimals</label>
          <input
            id="decimals"
            type="number"
            min="0"
            max="4"
            value="2"
          >
        </div>

        <button id="guardarConfig" onclick="guardarConfiguracio()">
          Desar
        </button>

        <div id="mensajeConfig"></div>

      </div>


      <!-- ESTAT INICIAL -->

      <div id="faseInicial" class="fase">

        <h1>Sorteig aleatori</h1>

        <p>
          Prem el botó per començar
        </p>

      </div>


      <!-- FASE 1 -->

      <div id="faseNom" class="fase">

        <div class="titulo-fase">
          Escollint alumne...
        </div>

        <img
          id="imatgeNom"
          src="namesinhat.jpg"
          alt="Noms dins d'un barret"
        >

        <div class="barra-contenidor">
          <div id="barraNom" class="barra-progres"></div>
        </div>

      </div>


      <!-- FASE 2 -->

      <div id="faseNumero" class="fase">

        <div class="titulo-fase">
          Escollint número...
        </div>

        <img
          id="bombo"
          src="bingo.gif"
          alt="Bombo de bingo"
        >

        <div class="barra-contenidor">
          <div id="barraNumero" class="barra-progres"></div>
        </div>

      </div>


      <!-- FASE 3 -->

      <div id="faseResultat" class="fase">

        <div id="resultatNom">
          —
        </div>

        <div id="resultatNumeroText">
          Has de col·locar el número...
        </div>

        <div id="numero">
          —
        </div>

      </div>


      <!-- BOTÓ PRINCIPAL -->

      <button
        id="boton"
        onclick="generar()">
        Generar
      </button>

    </div>


    <!-- DRETA -->

    <div class="cuadro">

      <h3>Queden per sortir</h3>

      <div id="queden" class="lista-nombres"></div>

    </div>

  </div>


  <script>

    const alumnes = [

      { nom: "Jan", article: "al" },
      { nom: "Jaden", article: "al" },
      { nom: "Laura", article: "a la" },
      { nom: "Hugo", article: "a l'" },
      { nom: "Faustino", article: "al" },
      { nom: "Tamara", article: "a la" },
      { nom: "María", article: "a la" },
      { nom: "Silke", article: "a la" },
      { nom: "Lila", article: "a la" },
      { nom: "Naila", article: "a la" },
      { nom: "Jad", article: "al" },
      { nom: "Ilina", article: "a l'" },
      { nom: "Martí", article: "al" },
      { nom: "Laia", article: "a la" },
      { nom: "Aleksandr", article: "a l'" },
      { nom: "Andrew Matías", article: "a l'" },
      { nom: "Dominika", article: "a la" },
      { nom: "Albert", article: "a l'" },
      { nom: "Varvara", article: "a la" },
      { nom: "Luz", article: "a la" },
      { nom: "Aliha", article: "a l'" },
      { nom: "Andrew Jeremías", article: "a l'" },
      { nom: "Ellen", article: "a l'" },
      { nom: "Redhen", article: "al" },
      { nom: "Amy", article: "a l'" },
      { nom: "Taoming", article: "al" },
      { nom: "Hengji", article: "al" }

    ];


    let minim = -5;
    let maxim = 5;
    let decimals = 2;


    function crearNumeros() {

      const numeros = [];

      const factor =
        Math.pow(10, decimals);

      const inicio =
        Math.round(minim * factor);

      const final =
        Math.round(maxim * factor);


      for (let i = inicio; i <= final; i++) {

        numeros.push(i / factor);

      }

      return numeros;

    }


    let alumnesDisponibles = [...alumnes];
    let alumnesSortits = [];
    let numerosDisponibles = crearNumeros();


    function actualizarListas() {

      const hanSortit =
        document.getElementById("hanSortit");

      const queden =
        document.getElementById("queden");


      if (alumnesSortits.length === 0) {

        hanSortit.innerHTML = "—";

      } else {

        hanSortit.innerHTML =
          alumnesSortits
            .map(alumne => alumne.nom)
            .join("<br>");

      }


      if (alumnesDisponibles.length === 0) {

        queden.innerHTML = "—";

      } else {

        queden.innerHTML =
          alumnesDisponibles
            .map(alumne => alumne.nom)
            .join("<br>");

      }

    }


    function ocultarFases() {

      document.getElementById("faseInicial").style.display = "none";
      document.getElementById("faseNom").style.display = "none";
      document.getElementById("faseNumero").style.display = "none";
      document.getElementById("faseResultat").style.display = "none";

    }


    function animarBarra(id, duracion) {

      const barra =
        document.getElementById(id);

      barra.style.transition = "none";
      barra.style.width = "0%";


      setTimeout(function() {

        barra.style.transition =
          "width " + duracion + "ms linear";

        barra.style.width = "100%";

      }, 50);

    }


    function toggleConfig() {

      const panel =
        document.getElementById("configPanel");

      if (panel.style.display === "block") {

        panel.style.display = "none";

      } else {

        panel.style.display = "block";

      }

    }


    function guardarConfiguracio() {

      const nouMinim =
        Number(document.getElementById("minim").value);

      const nouMaxim =
        Number(document.getElementById("maxim").value);

      const nousDecimals =
        Number(document.getElementById("decimals").value);

      const mensaje =
        document.getElementById("mensajeConfig");


      if (
        !Number.isFinite(nouMinim) ||
        !Number.isFinite(nouMaxim)
      ) {

        mensaje.textContent =
          "Introdueix valors vàlids.";

        return;

      }


      if (nouMinim >= nouMaxim) {

        mensaje.textContent =
          "El mínim ha de ser menor que el màxim.";

        return;

      }


      if (
        !Number.isInteger(nousDecimals) ||
        nousDecimals < 0 ||
        nousDecimals > 4
      ) {

        mensaje.textContent =
          "Els decimals han d'estar entre 0 i 4.";

        return;

      }


      const factor =
        Math.pow(10, nousDecimals);

      const quantitatNumeros =
        Math.round(
          (nouMaxim - nouMinim) * factor
        ) + 1;


      if (quantitatNumeros < alumnes.length) {

        mensaje.textContent =
          "No hi ha prou números diferents per a tots els alumnes.";

        return;

      }


      minim = nouMinim;
      maxim = nouMaxim;
      decimals = nousDecimals;


      /* Reiniciem els números disponibles */

      numerosDisponibles =
        crearNumeros();


      mensaje.textContent =
        "Configuració desada.";


      setTimeout(function() {

        document.getElementById("configPanel").style.display =
          "none";

      }, 800);

    }


    function generar() {

      const boton =
        document.getElementById("boton");


      boton.disabled = true;

      document.getElementById("botonConfig").disabled =
        true;


      /* NOVA RONDA */

      if (alumnesDisponibles.length === 0) {

        alumnesDisponibles = [...alumnes];
        alumnesSortits = [];
        numerosDisponibles = crearNumeros();

      }


      /* TRIAR ALUMNE */

      const indiceAlumne =
        Math.floor(
          Math.random() *
          alumnesDisponibles.length
        );


      const alumne =
        alumnesDisponibles[indiceAlumne];


      /* TRIAR NÚMERO */

      const indiceNumero =
        Math.floor(
          Math.random() *
          numerosDisponibles.length
        );


      const numeroEscollit =
        numerosDisponibles[indiceNumero];


      /* FASE 1: ALUMNE */

      ocultarFases();

      document.getElementById("faseNom").style.display =
        "flex";

      animarBarra("barraNom", 2500);


      setTimeout(function() {


        /* FASE 2: NÚMERO */

        ocultarFases();

        document.getElementById("faseNumero").style.display =
          "flex";

        animarBarra("barraNumero", 3000);


        setTimeout(function() {


          /* ELIMINAR ALUMNE */

          alumnesDisponibles.splice(
            indiceAlumne,
            1
          );

          alumnesSortits.push(alumne);


          /* ELIMINAR NÚMERO */

          numerosDisponibles.splice(
            indiceNumero,
            1
          );


          /* FORMATAR NÚMERO */

          const numeroAleatori =
            numeroEscollit >= 0
              ? "+" + numeroEscollit.toFixed(decimals)
              : numeroEscollit.toFixed(decimals);


          /* RESULTAT FINAL */

          ocultarFases();

          document.getElementById("faseResultat").style.display =
            "flex";


          document.getElementById("resultatNom").textContent =
            "Li ha tocat " +
            alumne.article +
            (alumne.article === "a l'" ? "" : " ") +
            alumne.nom;


          document.getElementById("numero").textContent =
            numeroAleatori;


          actualizarListas();


          boton.disabled = false;

          document.getElementById("botonConfig").disabled =
            false;


        }, 3050);


      }, 2550);

    }


    actualizarListas();

  </script>

</body>
</html>
