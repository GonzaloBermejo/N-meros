<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Selector aleatorio</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
      background-color: #f5f5f5;
    }

    h1 {
      font-size: 36px;
    }

    #nombre {
      font-size: 50px;
      font-weight: bold;
      margin: 40px 20px 20px;
    }

    #numero {
      font-size: 80px;
      font-weight: bold;
      margin: 20px;
    }

    #quedan {
      font-size: 20px;
      margin: 20px;
    }

    button {
      font-size: 26px;
      padding: 15px 35px;
      cursor: pointer;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>Selector aleatorio</h1>

  <div id="nombre">---</div>

  <div id="numero">---</div>

  <div id="quedan">Quedan 27 alumnos</div>

  <button onclick="generar()">Generar</button>

  <script>

    const nombres = [
      "Jan Abajo Hou",
      "Jaden Steven Andrade Sánchez",
      "Laura Arbat Ruíz",
      "Hugo Barroso Martínez",
      "Faustino Caporale",
      "Tamara Cherif García",
      "María Forts Marías",
      "Silke García Martínez",
      "Lila García García",
      "Naila Gracia Werckmeister",
      "Jad Gridda",
      "Ilina Hu",
      "Martí Iglesias Rico",
      "Laia Mora Moreno",
      "Aleksandr Muzykantsky",
      "Andrew Matías Navas González",
      "Dominika Osman",
      "Albert Quintana Vega",
      "Varvara Rabetskaya",
      "Luz Rodríguez Jaen",
      "Aliha Saleem",
      "Andrew Jeremías Sánchez Riveros",
      "Ellen Zooey Sánchez Ramos",
      "Redhen Dwayne Sandoval Asilo",
      "Amy Sueiro",
      "Taoming Ye",
      "Hengji Zhang"
    ];

    let nombresDisponibles = [...nombres];

    function generar() {

      // Si ya han salido todos, empieza una nueva ronda
      if (nombresDisponibles.length === 0) {
        nombresDisponibles = [...nombres];
      }

      // Elegir alumno al azar
      const indice = Math.floor(Math.random() * nombresDisponibles.length);

      // Eliminarlo de la lista para que no vuelva a salir
      const nombreAleatorio = nombresDisponibles.splice(indice, 1)[0];

      // Generar número aleatorio entre -5 y +5
      const numero = Math.random() * 10 - 5;

      // Mostrar siempre el signo + para los positivos
      const numeroAleatorio =
        numero >= 0
          ? "+" + numero.toFixed(2)
          : numero.toFixed(2);

      document.getElementById("nombre").textContent = nombreAleatorio;
      document.getElementById("numero").textContent = numeroAleatorio;

      // Mostrar cuántos quedan
      if (nombresDisponibles.length === 0) {
        document.getElementById("quedan").textContent =
          "¡Han salido todos! La próxima vez comienza una nueva ronda.";
      } else if (nombresDisponibles.length === 1) {
        document.getElementById("quedan").textContent =
          "Queda 1 alumno";
      } else {
        document.getElementById("quedan").textContent =
          "Quedan " + nombresDisponibles.length + " alumnos";
      }
    }

  </script>

</body>
</html>
